[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scintkit"
dynamic = ["version"]
description = "Simple tools for working with ScintPi data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "ScintPi contributors" },
]
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<20",
  "scipy>=1.15,<2",
  "h5py",
  "matplotlib",
]


[project.optional-dependencies]
dev = [
  "matplotlib",
  "pytest",
]
# Signal classification; the bundled model was pickled with scikit-learn 1.6.1.
ml = [
  "scikit-learn==1.6.1",
  "joblib>=1.2",
]

[project.scripts]
scintkit-ml-features = "scintkit.machine_learning.features:main"
scintkit-process = "scintkit.pipeline:main"

[tool.setuptools.dynamic]
version = { attr = "scintkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scintkit = ["data/station_scintpi_codes.csv", "data/histgb_full_25features.joblib"]
